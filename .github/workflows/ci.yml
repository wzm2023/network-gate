name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker policy and isolated client tests
        run: node --experimental-loader ./tests/cloudflare-loader.mjs --test tests/*.test.mjs
      - name: Worker syntax
        run: |
          node --check workers/checker.mjs
          node --check workers/edge.mjs
          node --check workers/vendor/checker.mjs
          node --check workers/vendor/edgetunnel.mjs
