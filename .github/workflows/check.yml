name: VPN Gate Node Check
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gate-publish
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Detect and validate public nodes
        env:
          DOMAIN: ${{ vars.CHECKER_HOST }}
          CHECK_TOKEN: ${{ secrets.CHECK_TOKEN }}
          EDGE_HOSTS: ${{ vars.EDGE_HOST }}:443
          CHECK_CONCURRENCY: '6'
          CHECK_TIMEOUT: '40'
          CHECK_DEADLINE: '600'
          HTTP_TIMEOUT: '30'
          MAX_CHECK_NODES: '120'
          MIN_SUCCESS_COUNT: '3'
          MIN_SUCCESS_RATIO: '0.05'
          MAX_LATENCY_MS: '20000'
          RESULT_TTL_SECONDS: '7200'
          EXCLUDE_ABUSERS: 'true'
        run: |
          if [ -z "$DOMAIN" ] || [ -z "$CHECK_TOKEN" ]; then
            echo 'Missing CHECKER_HOST variable or CHECK_TOKEN secret'
            exit 1
          fi
          python vpngate.py
      - name: Publish private subscription snapshot to Worker KV
        env:
          EDGE_HOST: ${{ vars.EDGE_HOST }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: python scripts/publish_nodes.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published freshness
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/check_published.py
  heartbeat:
    needs: check
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record successful maintenance at most once per 14 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/heartbeat.py
